name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build engine and smoke-test API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build C++ engine
        run: g++ -O2 -std=c++17 -Wall -Wextra -pedantic engine.cpp -o engine

      - name: Check Python syntax
        run: python -m compileall -q app.py

      - name: Smoke-test the API
        run: |
          python - <<'PY'
          from app import app

          with app.test_client() as client:
              assert client.get("/").status_code == 200
              health = client.get("/healthz").get_json()
              assert health["status"] == "ok" and health["engine"] is True

              ok = client.post(
                  "/recommend",
                  data={"genre": "Sci-Fi", "year_range": "2010s", "min_rating": "8"},
              )
              assert ok.status_code == 200
              assert isinstance(ok.get_json(), list) and ok.get_json()

              bad = client.post("/recommend", data={"genre": "../../etc/passwd"})
              assert bad.status_code == 400

              assert client.get("/autocomplete?q=inter").status_code == 200
          print("Smoke tests passed")
          PY
