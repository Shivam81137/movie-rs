<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch | Team Project</title>
    <style>
        /* --- IMPORTING FONTS --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        /* --- GENERAL STYLES --- */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            
            /* --- BACKGROUND IMAGE SETTINGS --- */
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), 
                              url("{{ url_for('static', filename='background.jpg') }}");
            
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- HEADER --- */
        h1 { 
            color: #e50914; 
            margin-top: 60px; 
            font-size: 4rem; 
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0px 0px 30px rgba(229, 9, 20, 0.8);
            margin-bottom: 10px;
            font-weight: 800;
        }

        .tagline {
            color: #ddd;
            font-size: 1.3rem;
            margin-bottom: 40px;
            font-weight: 300;
            text-shadow: 0 2px 4px rgba(0,0,0,1);
            background: rgba(0,0,0,0.4); 
            padding: 5px 15px;
            border-radius: 20px;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 900px;
            flex: 1; 
        }

        /* --- SEARCH BOX --- */
        .search-box {
            background: rgba(0, 0, 0, 0.75); 
            padding: 25px;
            border-radius: 50px;
            display: flex;
            gap: 15px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.6);
            margin-bottom: 50px;
        }

        select {
            flex-grow: 1; 
            background: transparent;
            color: white; 
            border: none;
            font-size: 18px;
            padding: 10px;
            outline: none;
        }
        
        select option {
            background: #222;
            color: white;
        }

        button { 
            background-color: #e50914; 
            color: white; 
            padding: 12px 40px;
            font-size: 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer; 
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5);
            text-transform: uppercase;
        }

        button:hover { 
            background-color: #ff0f1f; 
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.8);
        }
        
        /* --- RESULTS GRID --- */
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        /* --- MOVIE CARD --- */
        .movie-card {
            background: rgba(25, 25, 25, 0.85); 
            backdrop-filter: blur(20px);
            border-radius: 16px;
            display: flex;
            align-items: center;
            overflow: hidden;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.03);
            background: rgba(40, 40, 40, 0.95);
            box-shadow: 0 15px 35px rgba(229, 9, 20, 0.25); 
            border: 1px solid #e50914;
        }

        .movie-poster {
            width: 110px;          
            height: 165px;        
            object-fit: cover;    
            display: block;
        }

        .movie-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
        }

        .movie-title {
            margin: 0; 
            font-size: 22px;
            font-weight: 600;
            color: white;
            line-height: 1.2;
        }

        .genre-tag {
            font-size: 12px;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 300;
        }

        .rating {
            color: #ffd700; 
            font-weight: bold;
            font-size: 16px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 215, 0, 0.1);
            padding: 4px 10px;
            border-radius: 4px;
            width: fit-content;
        }

        /* --- FOOTER (TEAM NAMES) --- */
        .footer {
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            padding: 40px 0;
            margin-top: 50px;
            border-top: 2px solid #e50914; 
            box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
        }

        .team-title {
            color: #e50914;
            font-size: 16px;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
        }

        .team-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            max-width: 900px;
            margin: 0 auto;
        }

        .team-member {
            text-align: center;
            transition: transform 0.3s;
        }
        
        .team-member:hover {
            transform: translateY(-3px);
        }

        .team-name {
            font-weight: 600;
            color: #fff;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .roll-no {
            color: #888;
            font-size: 14px;
            font-family: monospace;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>CineMatch</h1>
        <p class="tagline">Discover Your Next Favorite Story</p>

        <div class="search-box">
            <select id="genreSelect">
                <option value="" disabled selected>Select a Genre...</option>
                <option value="Action">Action</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Crime">Crime</option>
            </select>
            <button onclick="getRecommendations()">Search</button>
        </div>

        <div id="resultsArea" class="results">
            <!-- Movie cards appear here -->
        </div>
    </div>

    <!-- TEAM FOOTER -->
    <div class="footer">
        <div class="container">
            <div class="team-title">Developed By CSE Department (HBTU)</div>
            <div class="team-grid">
                <div class="team-member">
                    <div class="team-name">SHIVAM PATEL</div>
                    <div class="roll-no">Roll No: 68</div>
                </div>
                <div class="team-member">
                    <div class="team-name">PRIYANSHU</div>
                    <div class="roll-no">Roll No: 57</div>
                </div>
                <div class="team-member">
                    <div class="team-name">SIDDHARTH KUMAR GAUTAM</div>
                    <div class="roll-no">Roll No: 72</div>
                </div>
                <div class="team-member">
                    <div class="team-name">VARUN GUPTA</div>
                    <div class="roll-no">Roll No: 82</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function getRecommendations() {
            const genre = document.getElementById('genreSelect').value;
            const resultsArea = document.getElementById('resultsArea');
            
            if(!genre) {
                alert("Please select a genre first!");
                return;
            }

            // Loading animation
            resultsArea.innerHTML = '<p style="color:#fff; font-size:18px; text-shadow:0 0 10px #000;">Analyzing preferences...</p>';

            const formData = new FormData();
            formData.append('genre', genre);

            try {
                const response = await fetch('/recommend', {
                    method: 'POST',
                    body: formData
                });
                const movies = await response.json();

                resultsArea.innerHTML = ''; 

                if (movies.error) {
                    resultsArea.innerHTML = `<p style="color:red; background:rgba(0,0,0,0.8); padding:10px; border-radius:5px;">Error: ${movies.error}</p>`;
                } else if (movies.length === 0) {
                    resultsArea.innerHTML = '<p style="background:rgba(0,0,0,0.8); padding:10px; border-radius:5px;">No movies found for this genre.</p>';
                } else {
                    movies.forEach(movie => {
                        resultsArea.innerHTML += `
                            <div class="movie-card">
                                <img src="${movie.image}" alt="${movie.title}" class="movie-poster">
                                <div class="movie-info">
                                    <h3 class="movie-title">${movie.title}</h3>
                                    <div class="genre-tag">${genre} Movie</div>
                                    <span class="rating">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="#ffd700"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                                        ${movie.rating} / 10
                                    </span>
                                </div>
                            </div>
                        `;
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                resultsArea.innerHTML = '<p style="color:red">Something went wrong!</p>';
            }
        }
    </script>
</body>
</html>
